# heat-api-cfn gọi Keystone /v3/ec2tokens để kiểm tra chữ ký alarm_url (Heat -> Aodh/autoscale webhook).
# Keystone 2025.x không còn chấp nhận lời gọi này khi không xác thực (401) -> alarm_url trả 403. Cho heat xác thực bằng chính user heat.
[ec2authtoken]
auth_type = password
auth_url = http://10.10.0.10:5000
username = heat
password = {{ heat_keystone_password }}
project_name = service
user_domain_name = Default
project_domain_name = Default
valid_interfaces = internal
