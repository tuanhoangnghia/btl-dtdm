---
# CloudJudge - Kolla-Ansible 21.x (2025.2 Flamingo), Ubuntu 24.04, 1 controller + 2 compute.
# Swift KHÔNG nằm trong Kolla từ 2025.1 (role đã bị xóa) -> cài tay, xem infra/swift/.
# Bản sao lưu trong Git; trên controller đặt tại /etc/kolla/globals.yml. KHÔNG chứa mật khẩu (passwords.yml riêng).
kolla_base_distro: "ubuntu"
openstack_release: "2025.2"

kolla_internal_vip_address: "10.10.0.10"   # 1 controller, không dùng VIP/keepalived
network_interface: "ens4"
neutron_external_interface: "veth-ex"      # mạng external giả (xem infra/host/prepare-controller.sh)
neutron_plugin_agent: "openvswitch"        # Octavia tenant-network mode chỉ hỗ trợ OVS (xem docs/tasks/A-ha-tang.md)
enable_haproxy: "no"
enable_proxysql: "no"                      # mặc định = enable_mariadb; ProxySQL bind VIP:3306 trùng IP controller -> MariaDB không lên
nova_compute_virt_type: "kvm"

enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"
enable_cinder_backup: "no"

enable_heat: "yes"
enable_horizon: "yes"

enable_octavia: "yes"
octavia_network_type: "tenant"
octavia_auto_configure: "yes"
enable_redis: "no"
enable_valkey: "yes"                       # Redis đã được thay bằng Valkey từ 2025.2

enable_fluentd: "no"                       # tiết kiệm RAM/đĩa
